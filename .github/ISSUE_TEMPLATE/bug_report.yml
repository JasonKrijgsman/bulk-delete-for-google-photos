name: Bug report
description: It stopped with a message, did something unexpected or did not start.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. First check [Troubleshooting](https://github.com/JasonKrijgsman/bulk-delete-for-google-photos#troubleshooting) in the README. It has an answer for most messages.

        **Do not post your email address.** The panel shows your Google account, and the first line of its log names it. Remove it from anything you paste here, and hide it in screenshots.

  - type: input
    id: version
    attributes:
      label: Version
      description: The panel shows it at the bottom right, such as v1.1.0.
      placeholder: v1.1.0
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Open the browser menu, then Help, then About. In Chrome this is chrome://settings/help.
      placeholder: Browser name and version number
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Extension, from the ZIP on the Releases page
        - Extension, from a clone of this repository
        - Userscript, in a userscript manager
        - Pasted into the console
    validations:
      required: true

  - type: input
    id: manager
    attributes:
      label: Userscript manager and version
      description: Only for the userscript. The manager's menu shows its version.
      placeholder: Manager name and version number

  - type: input
    id: language
    attributes:
      label: Google Photos interface language
      description: The language of the menus and buttons in Google Photos. The tool looks for its buttons by their labels, so this matters most.
      placeholder: English (United States)
    validations:
      required: true

  - type: dropdown
    id: page
    attributes:
      label: Which page were you on?
      options:
        - Library (Photos)
        - Archive
        - Another page
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: What the panel said
      description: Copy the message from the panel, such as the text in red. If the panel did not appear, say so.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log lines from the panel
      description: The grey box in the panel lists the last steps. Copy all of it, then remove your email address from the first line.
      render: text

  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, what you expected and what happened instead. Say roughly how many photos were in the Library or Archive.
      placeholder: |
        1. Opened the Library, about 5,000 photos.
        2. Left the number empty and clicked Move to trash, then Yes, move them.
        3. After two batches the panel stopped with the message above.
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Drag an image here. Hide your email address and your photos first.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed my email address from the log lines and screenshots.
          required: true
