name: ci

# Tests on every push and pull request. On a v* tag it also zips the extension
# folder and attaches it to the release, so the download on the Releases page
# is always built from the tagged source.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The fixture test skips itself without Chrome. Fail loudly instead.
      - name: Chrome is available for the fixture test
        run: google-chrome --version

      - name: Test
        run: npm test

  release:
    name: package and release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Zip the extension
        run: |
          cd extension
          zip -r "../free-photos-remover-$GITHUB_REF_NAME.zip" .
          cd ..
          sha256sum "free-photos-remover-$GITHUB_REF_NAME.zip" > "free-photos-remover-$GITHUB_REF_NAME.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "free-photos-remover-$GITHUB_REF_NAME.zip" \
            "free-photos-remover-$GITHUB_REF_NAME.zip.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes "Unzip, open chrome://extensions, turn on Developer mode, click Load unpacked and pick the unzipped folder. Changes are in CHANGELOG.md."
