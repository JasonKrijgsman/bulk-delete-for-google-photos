<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fake Google Photos library</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px sans-serif; }
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box; background: #f1f3f4; }
  #topbar button { width: 40px; height: 40px; }
  #nav { position: fixed; top: 80px; left: 0; width: 180px; display: flex; flex-direction: column; gap: 8px; padding: 8px; box-sizing: border-box; }
  c-wiz { display: block; position: fixed; top: 64px; left: 180px; right: 0; bottom: 0; overflow-y: auto; }
  #grid { position: relative; }
  .tile { position: absolute; width: 100px; height: 100px; background: #ccc; }
  .tile [role="checkbox"] { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; background: #fff; }
  .tile a { position: absolute; left: 32px; top: 32px; right: 0; bottom: 0; }
  .day { position: absolute; left: 0; height: 30px; display: flex; gap: 8px; align-items: center; }
  .day [role="checkbox"] { width: 20px; height: 20px; background: #fff; }
  .dlg { position: fixed; top: 200px; left: 400px; width: 320px; padding: 16px; background: #fff; border: 1px solid #333; }
  #result { position: fixed; bottom: 0; left: 0; width: 10px; height: 10px; overflow: hidden; }
</style>
</head>
<body>
<div id="topbar"></div>
<nav id="nav">
  <a href="./trash">Trash</a>
  <!-- A trash button below the top bar. The remover must never click it. -->
  <button id="decoy" aria-label="Move to trash">Trash</button>
</nav>
<c-wiz role="main" id="main"><div id="grid"></div></c-wiz>
<pre id="result">pending</pre>
<script>window.FPR_NO_AUTOMOUNT = true;</script>
<script src="../../extension/remover.js"></script>
<script src="fake-photos.js"></script>
</body>
</html>
